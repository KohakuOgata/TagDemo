<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag Content Browser</title>
  <meta name="description" content="フォルダではなくタグでゲームアセットを管理する、Unreal Engine コンテンツブラウザ風デモ">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1.5 2h6l7 7-5.5 5.5-7-7z' fill='%23d8b06a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- メニューバー -->
    <header class="menubar">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M1.5 2h6l7 7-5.5 5.5-7-7z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="5.5" r="1.2" fill="currentColor"/></svg>
      </span>
      <nav class="menus" aria-hidden="true">
        <span>File</span><span>Edit</span><span>Window</span><span>Tools</span><span>Help</span>
      </nav>
      <span class="project">TagDemo</span>
    </header>

    <!-- タブ -->
    <div class="tabbar">
      <div class="tab active">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h5l1.5 1.5h6.5v8h-13z" fill="currentColor"/></svg>
        Content Browser 1
      </div>
    </div>

    <!-- ツールバー -->
    <div class="toolbar">
      <button class="btn btn-add" type="button" disabled title="デモでは無効">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2h2v5h5v2H9v5H7V9H2V7h5z" fill="currentColor"/></svg>
        Add
      </button>
      <button class="btn" type="button" disabled title="デモでは無効">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1l4 4H9v5H7V5H4zM2 11h2v2h8v-2h2v4H2z" fill="currentColor"/></svg>
        Import
      </button>
      <button class="btn" type="button" disabled title="デモでは無効">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h9l3 3v9H2zm2 2v3h6V4zm4 5.5a2 2 0 100 4 2 2 0 000-4z" fill="currentColor"/></svg>
        Save All
      </button>
      <span class="sep"></span>
      <button class="icon-btn" id="btn-back" type="button" title="戻る">
        <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="icon-btn" id="btn-forward" type="button" title="進む">
        <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <nav class="breadcrumb" id="breadcrumb" aria-label="選択中のタグ"></nav>
    </div>

    <div class="main">
      <!-- 左: タグパネル（フォルダツリーの代わり） -->
      <aside class="sidebar">
        <div class="panel-header">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2h6l7 7-5.5 5.5-7-7z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="5.5" r="1.2" fill="currentColor"/></svg>
          TAGS
        </div>
        <div class="search small">
          <input id="tag-filter" type="search" placeholder="タグを検索" autocomplete="off">
        </div>
        <ul class="tag-list" id="tag-list"></ul>
        <div class="sidebar-help">
          <p><b>タグの選択</b> = フォルダに入る</p>
          <p>選択中のタグと<b>完全一致</b>するアセットだけが表示されます。グレーのタグは今の選択と組み合わせられないタグです。</p>
        </div>
      </aside>

      <!-- 中央: アセットビュー -->
      <section class="content">
        <div class="content-toolbar">
          <div class="search">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5l3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg>
            <input id="asset-filter" type="search" placeholder="Search 表示中のアセット" autocomplete="off">
          </div>
          <label class="size-slider" title="サムネイルサイズ">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v5H2zm7 0h5v5H9zM2 9h5v5H2zm7 0h5v5H9z" fill="currentColor"/></svg>
            <input id="thumb-size" type="range" min="72" max="160" value="104">
          </label>
        </div>

        <div class="view" id="view">
          <div class="section-label" id="tag-section-label"></div>
          <div class="grid" id="tag-grid"></div>
          <div class="section-label" id="asset-section-label"></div>
          <div class="grid" id="asset-grid"></div>
          <div class="empty" id="empty" hidden></div>
        </div>

        <footer class="statusbar" id="statusbar"></footer>
      </section>

      <!-- 右: 詳細 -->
      <aside class="details" id="details">
        <div class="panel-header">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 8h12M2 13h8" stroke="currentColor" stroke-width="1.6"/></svg>
          DETAILS
        </div>
        <div class="details-body" id="details-body"></div>
      </aside>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
